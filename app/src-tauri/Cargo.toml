[package]
name = "culprit-app"
description = "Culprit desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "culprit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
culprit-core.workspace = true
culprit-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.3", features = [] }
tauri-plugin-updater = "=2.13.1"
tokio.workspace = true

# Screenshots: WKWebView takes the picture, AppKit puts it on the clipboard (all already in Tauri's tree).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSPasteboard"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKSnapshotConfiguration", "WKWebView"] }
