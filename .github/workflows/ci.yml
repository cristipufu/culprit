name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token, no secrets; third-party actions are pinned to commit SHAs (the comment says which tag).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tests never touch an OS keychain: secrets stay in memory.
  CULPRIT_KEYCHAIN: "off"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The desktop app crate needs the frontend build and, on Linux, WebKitGTK; the `app` job covers it.
      - name: Clippy
        run: cargo clippy --workspace --exclude culprit-app --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude culprit-app
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Typecheck the UI
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run typecheck

  app:
    name: Desktop app (${{ matrix.os }})
    needs: [fmt, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build the UI
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Clippy (desktop app)
        run: cargo clippy -p culprit-app --all-targets -- -D warnings
      # Unsigned: no certificates or notarization secrets in CI. Local signed builds use dev/build-local.sh.
      - name: Bundle
        working-directory: app
        run: bunx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: culprit-${{ runner.os }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 14
