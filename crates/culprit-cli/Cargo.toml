[package]
name = "culprit-cli"
description = "culprit: find what is slowing your database down"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "culprit"
path = "src/main.rs"

[dependencies]
culprit-core.workspace = true
culprit-engine.workspace = true
culprit-mcp.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# Hides a typed password (console echo off), as `stty -echo` does on Unix.
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
